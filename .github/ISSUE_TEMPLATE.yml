name: 任务 / 反馈
description: 提交一个新需求、bug 或改进建议
title: "[类型] 简短描述"
labels: ["triage"]
body:
  - type: dropdown
    id: type
    attributes:
      label: 类型
      options:
        - 新功能
        - Bug
        - 文档
        - 重构
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 描述
      placeholder: 清楚说明背景、预期与实际表现
    validations:
      required: true
  - type: textarea
    id: accept
    attributes:
      label: 验收标准
      placeholder: 怎样算做完了？
